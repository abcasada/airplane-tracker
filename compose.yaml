# Airplane Tracker. Public access goes through the server's shared Cloudflare Tunnel (see docs/DEPLOY.md).
# 1. cp .env.example .env and fill it in (at least PUBLIC_URL).
# 2. docker compose up -d --build
# 3. docker compose logs airplane-tracker   # shows the one-time setup token
services:
  airplane-tracker:
    build: .
    image: airplane-tracker:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - airplane-data:/data
    mem_limit: 256m
    networks: [tracker]
    # Localhost only: the tunnel (on the host network) reaches it here; nothing on the LAN can.
    # Requests arrive from this network's gateway (172.16.0.0/12), which is in DEFAULT_TRUSTED_PROXIES.
    ports:
      - "127.0.0.1:${HOST_PORT:-8790}:8080"

networks:
  tracker: {}

volumes:
  airplane-data: {}
