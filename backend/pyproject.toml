[project]
name = "airplane-tracker"
version = "0.1.0"
description = "Personal ADS-B aircraft alert service with a filter dashboard"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyotp>=2.10.0",
    "regex>=2026.9.29",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "C4", "PT", "RET", "TID"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT018", "C408"]
"app/**" = ["PT"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "segno.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-regex>=2026.9.29.20261005",
]
